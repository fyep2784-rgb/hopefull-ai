<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOPEFULL AI</title>

<style>
body {
    margin: 0;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 25px;
    background: #172631;
    border-bottom: 2px solid #00d68f;
}

h1 {
    color: #00d68f;
}

#chat {
    height: 65vh;
    overflow-y: auto;
    padding: 15px;
}

.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    overflow-wrap: anywhere;
}

.user {
    background: #087f5b;
    text-align: right;
}

.bot {
    background: #263746;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #172631;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: none;
    border-radius: 8px;
}

button {
    padding: 12px 18px;
    background: #00d68f;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>HOPEFULL AI</h1>
    <p>Dream Big. Build the Future.</p>
</header>

<div id="chat">
    <div class="message bot">
        Welcome to HOPEFULL AI! How can I help you?
    </div>
</div>

<div class="input-area">
    <input id="userInput" type="text"
           placeholder="Write your message...">
    <button id="sendButton" type="button">Send</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const button = document.getElementById("sendButton");

    function sendMessage() {
        const message = input.value.trim();

        if (message === "") return;

        const user = document.createElement("div");
        user.className = "message user";
        user.textContent = message;
        chat.appendChild(user);

        const bot = document.createElement("div");
        bot.className = "message bot";
        bot.textContent =
            "Welcome to HOPEFULL AI! I received your message: " + message;

        chat.appendChild(bot);

        input.value = "";
        chat.scrollTop = chat.scrollHeight;
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

});
</script>

</body>
</html>
